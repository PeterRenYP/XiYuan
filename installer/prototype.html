<div id="xy-installer" class="viz-dotted-background">
  <style>
    #xy-installer{font-family:"Microsoft YaHei UI","Microsoft YaHei",sans-serif;color:#c3cede;color-scheme:dark;padding:12px 0;--xy-bg:#25282d;--xy-panel:#22252a;--xy-line:#414954;--xy-accent:#a9d8e8;--xy-selected:#344d5c}
    #xy-installer *{box-sizing:border-box}
    #xy-installer [hidden]{display:none!important}
    #xy-installer button,#xy-installer input{font:inherit}
    #xy-installer button{color:inherit}
    #xy-installer button:disabled{opacity:.45;cursor:default}
    #xy-installer h1,#xy-installer h2,#xy-installer p{margin:0}
    #xy-installer .xy-window{position:relative;max-width:880px;margin:auto;background:var(--xy-bg);border:1px solid #4b535e;border-radius:5px;overflow:hidden;font-size:13px;line-height:1.6;box-shadow:0 10px 28px #0003}
    #xy-installer .xy-titlebar{height:39px;display:flex;justify-content:space-between;align-items:center;background:#1b1d21;padding:0 11px;border-bottom:1px solid #383d45;gap:10px}
    #xy-installer .xy-title{display:flex;align-items:center;gap:8px;font-size:12px}
    #xy-installer .xy-title img{width:20px;height:20px}
    #xy-installer .xy-preview-label{font-size:11px;color:#a6b3c2;margin-left:5px}
    #xy-installer .xy-close{background:transparent;border:0;width:44px;height:29px;font-size:11px;border-radius:2px}
    #xy-installer .xy-close:hover{background:#843d40;color:#edf0f5}
    #xy-installer svg{width:15px;height:15px;flex-shrink:0}
    #xy-installer .xy-layout{display:grid;grid-template-columns:137px minmax(0,1fr);min-height:560px}
    #xy-installer .xy-brand{display:flex;flex-direction:column;padding:27px 14px 19px;background:var(--xy-panel);border-right:1px solid #3b414a;min-width:0}
    #xy-installer .xy-brand-top{display:flex;align-items:center;gap:10px;margin:0 1px}
    #xy-installer .xy-logo{width:36px;height:36px;border-radius:6px}
    #xy-installer .xy-brandname{font-size:20px;font-weight:400;letter-spacing:2px;color:#d5e1ed}
    #xy-installer .xy-steps{list-style:none;padding:0;margin:46px -14px 0;display:grid;gap:4px}
    #xy-installer .xy-steps li{display:flex;align-items:center;gap:10px;padding:8px 16px;border-left:2px solid transparent;color:#9fadc0;font-size:12px;transition:background .3s,color .3s}
    #xy-installer .xy-stepnum{color:#96a9bc;font-size:11px;font-variant-numeric:tabular-nums}
    #xy-installer .xy-steps .active{background:#303f4a;border-left-color:#a9d8e8;color:#d3e7ef}
    #xy-installer .xy-steps .active .xy-stepnum{color:#c2e5ee}
    #xy-installer .xy-steps .done .xy-stepnum{color:#a7c6d7}
    #xy-installer .xy-scope{font-size:11px;color:#a1afc0;margin-top:auto;padding-top:24px}
    #xy-installer .xy-right{position:relative;min-width:0;isolation:isolate}
    #xy-installer .xy-page{width:100%;min-width:0;height:560px;min-height:560px;display:flex;flex-direction:column}
    #xy-installer .xy-page.xy-leaving{position:absolute;inset:0;pointer-events:none;z-index:2}
    #xy-installer .xy-content{flex:1;min-width:0;min-height:0;overflow:auto;padding:25px 25px 23px}
    #xy-installer h1{font-size:21px;line-height:1.4;font-weight:400;color:#d8e3ee}
    #xy-installer .xy-footer{display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:12px 20px;border-top:1px solid #3c424b;min-height:59px;background:#23262b;flex-wrap:wrap}
    #xy-installer .xy-button{display:inline-flex;justify-content:center;align-items:center;gap:7px;min-height:33px;min-width:70px;padding:6px 13px;white-space:nowrap;flex-shrink:0;border:1px solid #586473;border-radius:2px;background:#303741;font-size:12px;transition:background .16s}
    #xy-installer .xy-button:hover{background:#3a4652}
    #xy-installer .xy-button.primary{background:#405967;border-color:#7895a5;color:#e0edf4}
    #xy-installer .xy-button.primary:hover{background:#4b6878}
    #xy-installer .xy-label{display:block;color:#c1cfde;font-size:12px;margin:28px 0 8px}
    #xy-installer .xy-inputgroup{display:flex;gap:8px;align-items:center}
    #xy-installer .xy-input{width:100%;min-width:0;background:#202328;border:1px solid #53606e;border-radius:2px;padding:9px 10px;color:#d0dce8;font-size:12px}
    #xy-installer .xy-input[aria-invalid="true"]{border-color:#d89a90}
    #xy-installer .xy-error{font-size:12px;color:#edb1a5;min-height:24px;padding-top:5px}
    #xy-installer .xy-options{margin-top:22px}
    #xy-installer .xy-option{display:flex;align-items:center;gap:10px;min-height:39px;font-size:12px;padding:6px 0}
    #xy-installer input[type="checkbox"]{width:15px;height:15px;flex-shrink:0;accent-color:#8bb8ca;margin:0}
    #xy-installer .xy-subtitle{margin-top:8px;color:#afbfce;font-size:13px}
    #xy-installer .xy-overview{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,250px);gap:26px;margin-top:25px;align-items:start}
    #xy-installer .xy-features{list-style:none;margin:0;padding:0;display:grid;gap:17px}
    #xy-installer .xy-features li{padding-left:13px;border-left:2px solid #536b7b}
    #xy-installer .xy-features h2{font-size:14px;line-height:1.5;font-weight:400;color:#d7e2ed}
    #xy-installer .xy-features p{margin-top:3px;font-size:12px;line-height:1.7;color:#aebdce}
    #xy-installer .xy-screenshots{display:grid;gap:15px;min-width:0}
    #xy-installer .xy-screenshots figure{margin:0;min-width:0}
    #xy-installer .xy-screenshots img{display:block;width:100%;height:auto;aspect-ratio:648/344;border:1px solid #4a535f;border-radius:2px;background:#22252a}
    #xy-installer .xy-screenshots figcaption{margin-top:5px;color:#a9b9c9;font-size:11px}
    #xy-installer .xy-mode-notes{display:grid;gap:13px;margin-top:28px;padding-top:20px;border-top:1px solid #414954;font-size:12px;color:#aebdce}
    #xy-installer .xy-mode-notes p{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px}
    #xy-installer .xy-mode-notes strong{font-weight:400;color:#d3deea}
    #xy-installer .xy-install .xy-overview{margin-top:24px}
    #xy-installer button:focus-visible,#xy-installer input:focus-visible{outline:2px solid #a9d8e8;outline-offset:3px}
    #xy-installer .xy-install-status{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:16px 0 8px;font-size:12px;color:#afc1d3}
    #xy-installer .xy-percent{font-size:12px;font-variant-numeric:tabular-nums;color:#cee2ed}
    #xy-installer .xy-progress{height:4px;background:#414b57;overflow:hidden}
    #xy-installer .xy-progressfill{height:100%;background:#a5cbdc;transform-origin:left;transition:transform .2s linear}
    #xy-installer .xy-finish{display:flex;flex-direction:column;justify-content:center;align-items:flex-start}
    #xy-installer .xy-finishmark{display:flex;align-items:center;gap:9px;color:#b7d5df;margin-bottom:12px;font-size:12px}
    #xy-installer .xy-finishpath{margin-top:13px;color:#a7b8cb;font-size:12px;overflow-wrap:anywhere;max-width:100%}
    #xy-installer .xy-overlay{position:absolute;inset:0;z-index:10;padding:18px;background:#12171ddb;display:flex;align-items:center;justify-content:center}
    #xy-installer .xy-dialog{background:#292d34;border:1px solid #5a6675;border-radius:3px;width:100%;max-width:412px;min-width:0;padding:22px}
    #xy-installer .xy-dialog h2{font-size:17px;font-weight:400;color:#dce5ef}
    #xy-installer .xy-dialog-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;margin-top:23px}
    #xy-installer .xy-folders{display:grid;gap:6px;margin-top:17px}
    #xy-installer .xy-folder{display:flex;align-items:center;gap:9px;text-align:left;background:#23272d;border:1px solid #475563;border-radius:2px;padding:10px;font-size:12px;min-width:0}
    #xy-installer .xy-folder span{min-width:0;overflow-wrap:anywhere}
    #xy-installer .xy-folder[aria-pressed="true"]{background:#344d5c;border-color:#96b3c5}
    #xy-installer .xy-dim{color:#a1b2c4;font-size:11px}
    #xy-installer .xy-closed{padding:26px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:560px}
    #xy-installer .xy-closed h1{font-size:20px;margin-bottom:23px}
    @media(prefers-reduced-motion:reduce){#xy-installer *{animation:none!important;transition:none!important}}
    @media(max-width:620px){#xy-installer .xy-layout{grid-template-columns:116px minmax(0,1fr)}#xy-installer .xy-brand{padding-left:11px;padding-right:11px}#xy-installer .xy-brand-top{gap:7px}#xy-installer .xy-logo{width:31px;height:31px}#xy-installer .xy-brandname{font-size:18px}#xy-installer .xy-content{padding-left:18px;padding-right:18px}#xy-installer .xy-overview{grid-template-columns:1fr;gap:20px}#xy-installer .xy-screenshots{grid-template-columns:1fr 1fr;gap:12px}}
    @media(max-width:480px){#xy-installer{padding:7px 0}#xy-installer .xy-layout{display:block;min-height:0}#xy-installer .xy-brand{padding:13px 16px 0;border-right:0;border-bottom:1px solid #414852}#xy-installer .xy-brand-top{gap:9px}#xy-installer .xy-brandname{font-size:19px}#xy-installer .xy-steps{display:flex;justify-content:space-between;margin:14px -16px 0;gap:0}#xy-installer .xy-steps li{padding:8px 10px;gap:5px;border-left:0;border-bottom:2px solid transparent;font-size:11px}#xy-installer .xy-steps .active{border-bottom-color:#a9d8e8}#xy-installer .xy-scope{display:none}#xy-installer .xy-page{min-height:520px}#xy-installer .xy-content{padding:22px 15px}#xy-installer h1{font-size:20px}#xy-installer .xy-inputgroup{flex-wrap:wrap}#xy-installer .xy-input{font-size:16px;flex-basis:100%}#xy-installer .xy-inputgroup .xy-button{margin-left:auto}#xy-installer .xy-footer{padding:12px 15px}#xy-installer .xy-overlay{padding:12px}#xy-installer .xy-dialog{padding:18px}#xy-installer .xy-option{min-height:42px}#xy-installer .xy-closed{min-height:520px}}
    @media(pointer:coarse){#xy-installer button{min-height:44px}#xy-installer .xy-option{min-height:46px}}
  </style>
  <section class="xy-window" aria-label="析元安装器交互原型">

    <div id="xy-overlay" class="xy-overlay" hidden></div>

    // 新版首次打开从欢迎页开始，后续继续当前版本的预览进度。
    function restore(snapshot){const saved=snapshot?.privateContent;if(!saved)return;for(const key of ['desktop','menu','associate'])if(typeof saved[key]==='boolean')state[key]=saved[key];if(saved.revision===state.revision&&typeof saved.path==='string')state.path=saved.path;if(saved.revision==='static'){if(typeof saved.closed==='boolean')state.closed=saved.closed;if(Number.isInteger(saved.step)&&saved.step>=0&&saved.step<=4)state.step=saved.step===3?2:saved.step;}state.progress=state.step===4?100:0;}

    function normalizePath(value,selected=false){let path=String(value).trim().replace(/\//g,'\\');if(/^[a-zA-Z]:\\?$/.test(path))return path[0].toUpperCase()+':\\XiYuan';path=path.replace(/\\+$/,'');if(selected&&path.split('\\').at(-1).toLowerCase()!=='xiyuan')path+='\\XiYuan';return path;}

    function startInstall(){clearInterval(installTimer);installTimer=setInterval(()=>{if(modal||transitioning)return;state.progress=Math.min(100,state.progress+1);if(state.progress===100){clearInterval(installTimer);installTimer=null;state.step=4;render();remember();}else updateProgress();},170);}
    // 对话框仅用于目录选择与退出确认，不引入功能介绍弹窗。
    function openModal(kind){modal=kind;returnFocus=document.activeElement;shell.inert=true;overlay.hidden=false;let content='';if(kind==='browse'){folder=state.path;content=`<h2>选择目录</h2><div class="xy-folders">${[['C:\\Program Files\\XiYuan','默认程序目录'],['D:\\XiYuan','D 盘'],['E:\\应用\\XiYuan','E 盘']].map(f=>`<button type="button" class="xy-folder cursor-interaction" data-folder="${escapeText(f[0])}" aria-pressed="${folder===f[0]}"><i data-lucide="folder" aria-hidden="true"></i><span>${f[1]}<br><span class="xy-dim">${escapeText(f[0])}</span></span></button>`).join('')}</div><div class="xy-dialog-actions"><button type="button" class="xy-button cursor-interaction" data-action="dismiss">取消</button><button type="button" class="xy-button primary cursor-interaction" data-action="choose-folder">选择</button></div>`;}else if(kind==='overwrite')content='<h2>覆盖安装</h2><p style="margin-top:12px">此目录已有安装好的程序，继续安装将覆盖原目录程序，确定继续吗？</p><div class="xy-dialog-actions"><button type="button" class="xy-button cursor-interaction" data-action="dismiss">取消</button><button type="button" class="xy-button primary cursor-interaction" data-action="confirm-overwrite">继续安装</button></div>';else content=`<h2>${state.step===3?'取消安装演示？':'退出预览？'}</h2><div class="xy-dialog-actions"><button type="button" class="xy-button cursor-interaction" data-action="confirm-exit">退出</button><button type="button" class="xy-button primary cursor-interaction" data-action="dismiss">继续</button></div>`;overlay.innerHTML=`<section class="xy-dialog" role="dialog" aria-modal="true" aria-label="${kind==='browse'?'目录选择预览':kind==='overwrite'?'覆盖安装确认':'退出确认'}">${content}</section>`;icons();if(!reduced.matches)overlay.animate([{opacity:0},{opacity:1}],{duration:180,easing:'ease-out'});overlay.querySelector('button')?.focus();}
    // 覆盖需显式确认，取消时留在原安装选项页。
    function confirmOverwrite(){dismissModal();state.step=3;state.progress=0;render();remember();startInstall();}
    // 返回原页面的操作位置，避免关闭选择器后丢失输入焦点。
    function dismissModal(){modal='';overlay.hidden=true;overlay.innerHTML='';shell.inert=false;if(returnFocus?.isConnected)returnFocus.focus();}
    // 安装导航统一处理，融合期间忽略重复点击。
    root.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||button.disabled||transitioning)return;if(button.hasAttribute('data-folder')){folder=button.dataset.folder;overlay.querySelectorAll('[data-folder]').forEach(el=>el.setAttribute('aria-pressed',el===button));return;}switch(button.dataset.action){case 'next':if(state.step===1){commitPath();if(pathError(state.path))return;}state.step++;state.progress=0;render();remember();if(state.step===3)startInstall();break;case 'back':state.step--;render();remember();break;case 'browse':openModal('browse');break;case 'choose-folder':state.path=normalizePath(folder,true);dismissModal();root.querySelector('#xy-path').value=state.path;validateInput();remember();break;case 'confirm-overwrite':confirmOverwrite();break;case 'dismiss':dismissModal();break;case 'close':case 'cancel':if(!state.closed)openModal('exit');break;case 'confirm-exit':clearInterval(installTimer);installTimer=null;dismissModal();if(state.step===3){state.step=2;state.progress=0;}state.closed=true;render();remember();break;case 'finish':state.closed=true;render();remember();break;case 'restart':state.closed=false;state.step=0;state.progress=0;render();remember();break;}});
    // 路径错误就地显示，保留用户正在编辑的目录与光标。
    function validateInput(){const field=root.querySelector('#xy-path');if(!field)return;state.path=field.value;const error=pathError(state.path);root.querySelector('#xy-path-error').textContent=error;field.setAttribute('aria-invalid',!!error);root.querySelector('.xy-page:not(.xy-leaving) [data-action="next"]').disabled=!!error;}
    // 路径确认时统一补全，手动输入完整自定义目录仍按原值使用。
    function commitPath(){const field=root.querySelector('#xy-path');if(!field)return;field.value=normalizePath(field.value);validateInput();remember();}
    root.addEventListener('focusout',event=>{if(event.target.id==='xy-path')commitPath();});
    root.addEventListener('input',event=>{if(event.target.id==='xy-path')validateInput();});
    root.addEventListener('change',event=>{if(event.target.dataset.option)state[event.target.dataset.option]=event.target.checked;remember();});
    // 保留键盘顺序，并将确认框内的焦点限制在当前操作中。
    root.addEventListener('keydown',event=>{if(!modal)return;if(event.key==='Escape'){event.preventDefault();dismissModal();}else if(event.key==='Tab'){const controls=[...overlay.querySelectorAll('button,input')].filter(el=>!el.disabled);if(event.shiftKey&&document.activeElement===controls[0]){event.preventDefault();controls.at(-1).focus();}else if(!event.shiftKey&&document.activeElement===controls.at(-1)){event.preventDefault();controls[0].focus();}}});
    restore(window.openai?.widgetState);render(false);
    // 宿主图标库异步就绪后补绘首次生成的界面图标。
    let iconAttempts=0;const iconReady=setInterval(()=>{if(globalThis.lucide){icons();clearInterval(iconReady);}else if(++iconAttempts>=60||!root.isConnected)clearInterval(iconReady);},100);
    window.addEventListener('openai:set_globals',event=>{const snapshot=event.detail?.globals?.widgetState;if(snapshot&&!modal&&!transitioning&&state.step!==3){const before=JSON.stringify(state);restore(snapshot);if(before!==JSON.stringify(state))render();}});
  })();
  </script>
</div>
